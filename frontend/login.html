<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DocuTrack - Login</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body class="login-page">
  <div class="login-container">
    <div class="login-card">
      <div class="login-brand">
        <span id="loginMark"></span>
        <div>
          <h1>DocuTrack</h1>
          <p>Document Management System</p>
        </div>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="Enter your email" required autocomplete="email">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
        </div>

        <div id="errorMessage" class="error-message"></div>

        <button type="submit" class="login-button" id="loginButton">Login</button>
      </form>

      <div class="login-footer">
        <a href="privacy.html">Privacy Policy</a>
        <a href="terms.html">Terms & Conditions</a>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const loginMark = document.getElementById("loginMark");
      if (loginMark) loginMark.innerHTML = brandMark();
      if (localStorage.getItem("token")) {
        window.location.href = "dashboard.html";
        return;
      }

      const loginForm = document.getElementById("loginForm");
      const errorMessage = document.getElementById("errorMessage");
      const loginButton = document.getElementById("loginButton");

      loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        errorMessage.textContent = "";

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        if (!email || !password) {
          errorMessage.textContent = "Please fill in all fields.";
          return;
        }

        loginButton.disabled = true;
        loginButton.textContent = "Logging in...";

        try {
          const response = await loginUser(email, password);

          if (response.success) {
            window.location.href = "dashboard.html";
          } else {
            errorMessage.textContent = response.message || "Login failed. Please try again.";
            loginButton.disabled = false;
            loginButton.textContent = "Login";
          }
        } catch (error) {
          errorMessage.textContent = "An error occurred. Please try again.";
          loginButton.disabled = false;
          loginButton.textContent = "Login";
        }
      });
    });
  </script>
</body>
</html>
